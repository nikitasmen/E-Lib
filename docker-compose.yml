version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elib-app
    ports:
      - "8081:80"
    # NOTE: this bind-mount shadows the image-build-time public/dist/ (built by the
    # Dockerfile's `npm run build`) with whatever's on the host. For local compose use, run
    # `cd frontend && npm run build` on the host first (or `npm run dev` against the Vite
    # proxy instead of this container) so public/dist/index.html actually exists.
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - mongo
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
    networks:
      - elib-network

  caddy:
    image: caddy:2-alpine
    container_name: elib-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - app
    networks:
      - elib-network

  mongo:
    image: mongo:latest
    container_name: elib-mongo
    restart: unless-stopped
    ports:
      # Bound to loopback only: the app container reaches mongo over the internal
      # elib-network regardless of this mapping, which exists purely so a host-side
      # client (Compass, mongosh) can connect for local debugging. Publishing to all
      # interfaces (the Docker default for "27017:27017") would let anyone who can reach
      # this host connect with the default root/example credentials below.
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-e_lib}
    volumes:
      - mongo-data:/data/db
    networks:
      - elib-network

networks:
  elib-network:
    driver: bridge

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
