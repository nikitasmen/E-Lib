name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    runs-on: ubuntu-latest

    # For tests/Integration (real queries against the MongoDB version production code must support).
    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mbstring, mongodb

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP_CodeSniffer (PSR-12)
        run: composer run lint

      - name: PHPStan
        run: composer run analyse

      - name: PHPUnit (unit + integration)
        env:
          MONGO_TEST_URI: mongodb://localhost:27017
        run: composer run test

  js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: ESLint (frontend)
        run: cd frontend && npm run lint

      - name: vue-tsc typecheck
        run: cd frontend && npm run typecheck

      - name: Install e2e tooling dependencies
        run: npm ci

      - name: ESLint (qa/)
        run: npm run lint
