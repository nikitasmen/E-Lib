# CI only (.github/workflows/elib.yml, job production-stack): the production stack (Caddy TLS -> Apache app)
# plus a throwaway MongoDB, checked over HTTPS by docker/https-smoke.sh. Also runs locally beside the dev
# stack: own container names, ports 8080/8443.
# Reads .env.ci (never your .env, which may point at Atlas) — CI writes it; locally copy the one in elib.yml.
#   docker compose -p elib-ci --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml up -d --build app caddy mongo
#   docker/https-smoke.sh
#   docker compose -p elib-ci -f docker-compose.yml -f docker-compose.ci.yml down -v
services:
  app:
    container_name: elib-ci-app
    volumes: !override
      - ./.env.ci:/var/www/html/.env:ro
    depends_on:
      - mongo

  caddy:
    container_name: elib-ci-caddy
    ports: !override
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"

  mongo:
    image: mongo:4.4
    networks:
      - elib-network
