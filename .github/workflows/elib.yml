name: E-Lib CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The production stack as deploy.sh runs it (Caddy TLS -> Apache app image) with a throwaway MongoDB,
  # checked over HTTPS: what php -S over plain HTTP (the e2e job) can't show — redirect, HSTS, CSP for the
  # https origin, the Secure session cookie, auth headers surviving the proxy. Also catches a broken Dockerfile.
  production-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create .env.ci
        run: |
          cat > .env.ci << 'EOL'
          APP_URL=https://localhost
          API_BASE_URL=https://localhost/
          MONGO_URI=mongodb://mongo:27017
          JWT_SECRET_KEY=ci-https-smoke-secret
          CAS_SERVER_URL=https://auth.example.com/cas
          EOL

      - name: Build and start the stack
        run: docker compose -p elib-ci --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml up -d --build app caddy mongo

      - name: HTTPS checks
        run: docker/https-smoke.sh

      - name: Logs on failure
        if: failure()
        run: |
          docker compose -p elib-ci -f docker-compose.yml -f docker-compose.ci.yml logs --tail 100
          docker exec elib-ci-app tail -50 /var/www/html/storage/logs/php_errors.log || true
